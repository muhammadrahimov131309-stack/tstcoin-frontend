<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSTCOIN Mini App</title>
    <!-- Подключаем Tailwind CSS для крутого дизайна -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none pb-20">

    <!-- ШАПКА -->
    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 p-4 sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div id="user-avatar" class="w-10 h-10 rounded-full bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center font-bold text-lg shadow-lg shadow-purple-500/30">T</div>
            <div>
                <h1 id="user-name" class="font-bold text-sm text-slate-200">Загрузка...</h1>
                <span id="user-gang" class="text-xs text-indigo-400 font-medium">🏴 Банда: SHADOW</span>
            </div>
        </div>
        <div class="bg-slate-950/60 border border-slate-800 px-3 py-1.5 rounded-xl flex items-center gap-2 shadow-inner">
            <span class="text-amber-400 text-lg">🪙</span>
            <span id="user-balance" class="font-extrabold text-amber-300 tracking-wide">0</span>
        </div>
    </header>

    <!-- КОНТЕНТ -->
    <main class="flex-1 p-4 max-w-md mx-auto w-full space-y-4">
        
        <!-- ГЛАВНАЯ ВКЛАДКА -->
        <div id="tab-home" class="space-y-4">
            <div class="bg-gradient-to-br from-indigo-900/40 to-purple-900/40 border border-indigo-500/30 rounded-2xl p-5 text-center shadow-xl">
                <span class="text-xs uppercase tracking-wider text-indigo-300 font-semibold">Уровень <span id="user-level">1</span></span>
                <h2 id="card-name" class="text-2xl font-black mt-1 text-white">Боец</h2>
                <div class="mt-4 bg-slate-900 rounded-full h-3 overflow-hidden border border-slate-700/50">
                    <div id="xp-bar" class="bg-gradient-to-r from-indigo-500 to-purple-500 h-full w-1/2 transition-all duration-500"></div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="switchTab('casino')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 p-4 rounded-2xl text-left transition active:scale-95 shadow-md">
                    <span class="text-2xl">🎰</span>
                    <h3 class="font-bold text-sm mt-2 text-white">Казино</h3>
                    <p class="text-xs text-slate-400">Умножай баланс</p>
                </button>
                <button onclick="switchTab('shop')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 p-4 rounded-2xl text-left transition active:scale-95 shadow-md">
                    <span class="text-2xl">🛍️</span>
                    <h3 class="font-bold text-sm mt-2 text-white">Магазин</h3>
                    <p class="text-xs text-slate-400">Скины и тачки</p>
                </button>
            </div>
        </div>

        <!-- ВКЛАДКА КАЗИНО -->
        <div id="tab-casino" class="space-y-4 hidden">
            <h2 class="text-xl font-extrabold text-center text-amber-400">⚡ АПГРЕЙДЕР БАЛАНСА</h2>
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4 shadow-xl">
                <label class="text-xs text-slate-400 font-medium">Сумма ставки (монет)</label>
                <input type="number" id="bet-amount" value="100" class="w-full mt-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white font-bold focus:outline-none focus:border-indigo-500">
                <div class="grid grid-cols-3 gap-2 pt-2">
                    <button onclick="playCasino(1.5)" class="bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold text-sm">x1.5</button>
                    <button onclick="playCasino(2.0)" class="bg-purple-600 hover:bg-purple-500 py-3 rounded-xl font-bold text-sm">x2.0</button>
                    <button onclick="playCasino(5.0)" class="bg-amber-600 hover:bg-amber-500 py-3 rounded-xl font-bold text-sm">x5.0</button>
                </div>
                <div id="casino-msg" class="mt-4 p-3 rounded-xl text-center font-bold text-sm hidden"></div>
            </div>
        </div>

        <!-- ВКЛАДКА МАГАЗИН -->
        <div id="tab-shop" class="space-y-4 hidden">
            <h2 class="text-xl font-extrabold text-center text-slate-100">🛒 МАГАЗИН</h2>
            <div id="shop-list" class="space-y-3">
                <!-- Товары подгрузятся сами -->
            </div>
        </div>

    </main>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur border-t border-slate-800 py-3 px-6 flex justify-around items-center z-50">
        <button onclick="switchTab('home')" class="flex flex-col items-center gap-1 text-indigo-400">
            <span class="text-xl">🏠</span><span class="text-[10px] font-semibold">Главная</span>
        </button>
        <button onclick="switchTab('casino')" class="flex flex-col items-center gap-1 text-slate-400">
            <span class="text-xl">🎰</span><span class="text-[10px] font-semibold">Казино</span>
        </button>
        <button onclick="switchTab('shop')" class="flex flex-col items-center gap-1 text-slate-400">
            <span class="text-xl">🛍️</span><span class="text-[10px] font-semibold">Магазин</span>
        </button>
    </nav>

    <!-- СКРИПТ ЛОГИКИ -->
    <script>const API_URL = "https://my-api-kiqr.onrender.com";
 // Ссылка на твой Render бэкенд
        const tgId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || 7127705775;

        // Загрузка профиля
        fetch(`${API_URL}/api/profile/${tgId}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('user-name').innerText = data.nickname;
                document.getElementById('card-name').innerText = data.nickname;
                document.getElementById('user-balance').innerText = data.balance.toLocaleString();
                document.getElementById('user-level').innerText = data.level;
                document.getElementById('user-avatar').innerText = data.nickname[0].toUpperCase();
                document.getElementById('user-gang').innerText = "🏴 Банда: " + data.gang;
            });

        // Загрузка магазина
        fetch(`${API_URL}/api/магазин`)
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('shop-list');
                list.innerHTML = data.items.map(item => `
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center shadow-md">
                        <div>
                            <h3 class="font-bold text-white text-sm">${item.name}</h3>
                            <span class="text-xs text-indigo-400 capitalize">Тип: ${item.type}</span>
                        </div>
                        <div class="text-right">
                            <span class="font-extrabold text-amber-400 block text-sm">🪙 ${item.price.toLocaleString()}</span>
                            <button class="mt-1 bg-indigo-600 hover:bg-indigo-500 text-xs px-3 py-1.5 rounded-lg font-bold">Купить</button>
                        </div>
                    </div>
                `).join('');
            });

        // Переключение вкладок
        function switchTab(tab) {
            document.getElementById('tab-home').classList.add('hidden');
            document.getElementById('tab-casino').classList.add('hidden');
            document.getElementById('tab-shop').classList.add('hidden');
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
        }

        // Игра в казино
        function playCasino(mult) {
            const bet = document.getElementById('bet-amount').value;
            fetch(`${API_URL}/api/casino/upgrader`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ tg_id: tgId, amount: Number(bet), multiplier: mult })
            })
            .then(res => res.json())
            .then(data => {
                const msg = document.getElementById('casino-msg');
                msg.classList.remove('hidden');
                if(data.detail) {
                    msg.className = "mt-4 p-3 rounded-xl text-center font-bold text-sm bg-rose-950 border border-rose-500 text-rose-400";
                    msg.innerText = data.detail;
                } else {
                    msg.className = data.win ? "mt-4 p-3 rounded-xl text-center font-bold text-sm bg-emerald-950 border border-emerald-500 text-emerald-400" : "mt-4 p-3 rounded-xl text-center font-bold text-sm bg-rose-950 border border-rose-500 text-rose-400";
                    msg.innerText = data.win ? `🎉 Победа! Выиграно: +${data.payout}` : `😢 Проигрыш!`;
                    document.getElementById('user-balance').innerText = data.new_balance.toLocaleString();
                }
            });
        }
    </script>
</body>
</html>
